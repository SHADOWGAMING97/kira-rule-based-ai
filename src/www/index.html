<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kira</title>
<style>
  :root {
    --ink: #1c1b1a;
    --paper: #f7f5f1;
    --line: #d8d3c8;
    --accent: #5b6f5b;
    --accent-soft: #eaf0e8;
    --muted: #8a8578;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  body { display: flex; flex-direction: column; }

  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  header .mark {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header .sub {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--muted);
  }

  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.kira { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.42;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .row.user .bubble {
    background: var(--ink);
    color: var(--paper);
    border-bottom-right-radius: 4px;
  }

  .row.kira .bubble {
    background: var(--accent-soft);
    color: var(--ink);
    border: 1px solid #dbe4d8;
    border-bottom-left-radius: 4px;
  }

  .row.kira .bubble.thinking {
    color: var(--muted);
    font-style: italic;
  }

  footer {
    flex-shrink: 0;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  #composer {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    max-height: 100px;
    background: #fff;
    color: var(--ink);
  }

  #composer:focus { outline: none; border-color: var(--accent); }

  #send {
    flex-shrink: 0;
    border: none;
    background: var(--ink);
    color: var(--paper);
    border-radius: 12px;
    padding: 0 18px;
    height: 42px;
    font-size: 14.5px;
    font-weight: 600;
  }

  #send:active { opacity: 0.85; }
  #send:disabled { background: var(--muted); }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    padding: 0 30px;
  }

  .empty-state .glyph {
    font-size: 26px;
    margin-bottom: 8px;
  }

  .empty-state p { font-size: 13.5px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <div class="mark">Kira</div>
  <div class="sub">thinking, on this device only</div>
</header>

<div id="thread">
  <div class="empty-state" id="emptyState">
    <div class="glyph">◒</div>
    <p>Say something — Kira learns from this device's conversations only, nothing leaves unless you ask her to look something up.</p>
  </div>
</div>

<footer>
  <textarea id="composer" rows="1" placeholder="Message Kira..."></textarea>
  <button id="send">Send</button>
</footer>

<script type="module">
import { Brain1 } from './services/pipeline.js';

const thread = document.getElementById('thread');
const emptyState = document.getElementById('emptyState');
const composer = document.getElementById('composer');
const sendBtn = document.getElementById('send');

const brain = new Brain1();
let ready = false;

function addBubble(text, who, thinking = false) {
  if (emptyState) emptyState.remove();
  const row = document.createElement('div');
  row.className = `row ${who}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (thinking ? ' thinking' : '');
  bubble.textContent = text;
  row.appendChild(bubble);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
  return bubble;
}

function isOnline() {
  return navigator.onLine !== false;
}

async function handleSend() {
  const text = composer.value.trim();
  if (!text || !ready) return;

  composer.value = '';
  composer.style.height = 'auto';
  sendBtn.disabled = true;

  addBubble(text, 'user');
  const thinkingBubble = addBubble('...', 'kira', true);

  try {
    const reply = await brain.respond(text, isOnline, null);
    thinkingBubble.textContent = reply;
    thinkingBubble.classList.remove('thinking');
  } catch (e) {
    thinkingBubble.textContent = "Something went wrong on my end — didn't crash, but couldn't finish that thought.";
    thinkingBubble.classList.remove('thinking');
    console.error('Kira pipeline error:', e);
  }

  sendBtn.disabled = false;
  composer.focus();
}

sendBtn.addEventListener('click', handleSend);
composer.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
composer.addEventListener('input', () => {
  composer.style.height = 'auto';
  composer.style.height = Math.min(composer.scrollHeight, 100) + 'px';
});

(async () => {
  sendBtn.disabled = true;
  await brain.init();
  ready = true;
  sendBtn.disabled = false;
})();
</script>

</body>
</html>
